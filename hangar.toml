# rvkfoodie — the Reykjavík food guide. TanStack Start on Cloudflare Workers
# (workerd) via the Vite plugin, with D1, R2, KV and Vectorize emulated
# locally.
#
#   hangar up          boots the dev server, healthcheck-gated
#   hangar services    what is running, and on what URL
#   hangar requests    every request the proxy carried
#   hangar run         checks + receipts for the working tree
#   hangar watch       checks whenever the worktree goes quiet
#
# Env model (no .dev.vars — it is deleted):
#  - Non-sensitive, env-independent values live in wrangler.jsonc `vars`
#    (committed): ENVIRONMENT, ASSET_BASE_URL.
#  - Per-environment values ride wrangler's `secrets.required` channel
#    (see wrangler.jsonc): BETTER_AUTH_URL (dev origin differs from prod),
#    BETTER_AUTH_SECRET, CMS_WRITE_KEY, R2_ACCESS_KEY_ID,
#    R2_SECRET_ACCESS_KEY. Their values live in the macOS Keychain via
#    `hangar secrets set <KEY>`; this service's `env` list is the allowlist
#    the daemon injects into the process.
#  - CLOUDFLARE_INCLUDE_PROCESS_ENV=true is required because the Vite plugin
#    (not `wrangler dev`) runs the worker: hangar auto-sets that flag only
#    for wrangler invocations, so we set it in the run line to let the
#    injected process env reach the Worker's `env` bindings.
#
# The one wrinkle: vite.config.ts reads $PORT with a 3000 fallback, because
# the daemon owns the port and hands it over — two worktrees of this project
# run at once without colliding.

schema = 1

# Fresh worktrees (`hangar new`) get deps and a local D1 before first boot.
[setup]
run = ["pnpm install", "pnpm db:migrate", "pnpm db:seed"]

[services.web]
run = "CLOUDFLARE_ENV=development CLOUDFLARE_INCLUDE_PROCESS_ENV=true pnpm dev"
host = "web"
health.log = "ready in|Local:"
health_start_period = "5s"
env = [
  "BETTER_AUTH_SECRET",
  "CMS_WRITE_KEY",
  "R2_ACCESS_KEY_ID",
  "R2_SECRET_ACCESS_KEY",
]

# Browser work waits on this, not on "the process started".
[ready]
requires = ["web"]

# Per-key env rules (hangar docs env, §3) — the policy layer on top of the
# allowlist above. `from = "keychain"` pins where each value must come from
# (never a tracked file or a literal) and keeps secrets out of build-cache
# keys. No require_prefix: these values have no test/live prefix to guard.
[env.BETTER_AUTH_SECRET]
from = "keychain"

[env.CMS_WRITE_KEY]
from = "keychain"

[env.R2_ACCESS_KEY_ID]
from = "keychain"

[env.R2_SECRET_ACCESS_KEY]
from = "keychain"
