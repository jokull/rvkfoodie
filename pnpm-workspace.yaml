allowBuilds:
  '@parcel/watcher': set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  result-rpc: set this to true or false
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - result-rpc@0.3.0 || 0.5.0
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
  - '@parcel/watcher'
  - msgpackr-extract
verifyDepsBeforeRun: false
